<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Academic Research Copilot architecture  Task 3 agent tools</title>
  <desc id="desc">Next.js workspace talks to the FastAPI AI service. The agent router selects calculator, weather, web search, RAG, or direct LLM.</desc>
  <rect width="960" height="560" fill="#f7f4ef"/>
  <text x="40" y="44" font-family="Georgia, serif" font-size="22" fill="#1c2430">Academic Research Copilot  Task 3</text>
  <text x="40" y="70" font-family="Georgia, serif" font-size="14" fill="#5a6574">Constrained agent router + calculator / weather / web search</text>

  <rect x="40" y="100" width="220" height="120" rx="16" fill="#ffffff" stroke="#d5cfc4"/>
  <text x="150" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c2430">apps/web</text>
  <text x="150" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">Next.js ù Chat / RAG / Agent</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#0f6e56">User-safe status only</text>

  <polygon points="270,160 330,160 330,152 350,160 330,168 330,160" fill="#0f6e56"/>
  <text x="310" y="148" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5a6574">/api/v1</text>

  <rect x="370" y="100" width="250" height="120" rx="16" fill="#ffffff" stroke="#d5cfc4"/>
  <text x="495" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c2430">apps/ai-service</text>
  <text x="495" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">FastAPI agent router</text>
  <text x="495" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">deterministic + JSON classify</text>

  <rect x="680" y="40" width="240" height="72" rx="14" fill="#d7efe6" stroke="#0f6e56"/>
  <text x="800" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1c2430">Calculator</text>
  <text x="800" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">Safe AST ù no eval</text>

  <rect x="680" y="128" width="240" height="72" rx="14" fill="#ffffff" stroke="#d5cfc4"/>
  <text x="800" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1c2430">Weather</text>
  <text x="800" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">Open-Meteo ù labeled external</text>

  <rect x="680" y="216" width="240" height="72" rx="14" fill="#ffffff" stroke="#d5cfc4"/>
  <text x="800" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1c2430">Web search</text>
  <text x="800" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">DuckDuckGo / Tavily</text>

  <rect x="40" y="280" width="280" height="90" rx="14" fill="#ffffff" stroke="#d5cfc4"/>
  <text x="180" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1c2430">Gemini LLM</text>
  <text x="180" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">Answers + structured routing</text>

  <rect x="340" y="280" width="280" height="90" rx="14" fill="#ffffff" stroke="#d5cfc4"/>
  <text x="480" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1c2430">RAG + pgvector</text>
  <text x="480" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5a6574">Project-scoped chunks + citations</text>

  <rect x="40" y="400" width="880" height="120" rx="16" fill="#ffffff" stroke="#d5cfc4"/>
  <text x="480" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#1c2430">Data flow</text>
  <text x="480" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a6574">Validate ù select one route ù execute tool or retrieval ù label evidence ù persist reply</text>
  <text x="480" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a6574">Document citations stay distinct from web sources. Secrets stay server-side.</text>
</svg>
